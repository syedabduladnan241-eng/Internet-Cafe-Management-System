<!DOCTYPE html>
<html>
<head>
    <title>Billing History</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <h1 class="text-primary mb-4">Billing History</h1>

    <table class="table table-bordered table-striped shadow">

        <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>Customer</th>
                <th>Computer</th>
                <th>Amount</th>
                <th>Status</th>
            </tr>
        </thead>

        <tbody>

        {% for bill in bills %}

            <tr>
                <td>{{ bill[0] }}</td>
                <td>{{ bill[1] }}</td>
                <td>{{ bill[2] }}</td>
                <td>₹{{ "%.2f"|format(bill[3]) }}</td>
                <td>{{ bill[4] }}</td>
            </tr>

        {% endfor %}

        </tbody>

    </table>

    <a href="/dashboard" class="btn btn-primary">
        Back to Dashboard
    </a>

</div>

</body>
</html>
